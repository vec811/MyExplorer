<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Protection Explorer</title>
  <meta name="description" content="Explore these 3 protection needs to get a complete protection analysis." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="preload" href="explorer.mp4" as="fetch" type="video/mp4" crossorigin />
  <link rel="preload" href="explorer-poster.jpg" as="image" />
  <style>
    :root {
      /* Palette sampled from the video, accent from the logo */
      --sky: #ffffff;
      --path: #fde6ce;
      --ink: #12382a;
      --ink-soft: #3f5d50;
      --accent: #d52b1e;
      --card-ink: #3f3f3f;
      --bench: #4547b8;
      --wash: 255 252 247;
      --display: "Fraunces", Georgia, serif;
      --body: "DM Sans", system-ui, -apple-system, sans-serif;
      --gutter: clamp(16px, 4vw, 56px);
      --overlap: 28px; /* how far the option boxes sit over the scene */
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--path);
      color: var(--ink);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---------- Hero: nav / copy / scene / option boxes, stacked on every screen ---------- */
    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      overflow: clip;
      isolation: isolate;
      touch-action: pan-y;
      background: var(--sky);
    }

    /* ---------- Nav ---------- */
    .nav {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: max(16px, env(safe-area-inset-top)) var(--gutter) 0;
    }
    .brand { display: inline-flex; }
    .brand img { display: block; width: 44px; height: 44px; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      background: rgb(var(--wash) / .72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 1px 0 rgb(18 56 42 / .06), 0 8px 24px -12px rgb(18 56 42 / .25);
    }
    .nav-links a {
      color: var(--ink);
      text-decoration: none;
      font-size: .92rem;
      font-weight: 500;
      padding: 9px 14px;
      border-radius: 999px;
      transition: background .2s ease;
    }
    .nav-links a:hover { background: rgb(18 56 42 / .07); }

    /* ---------- Copy ---------- */
    .copy {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 44rem;
      margin: 0 auto;
      padding: clamp(8px, 2.5svh, 28px) var(--gutter) 0;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(2.1rem, min(6vw, 7svh), 4.2rem);
      line-height: 1;
      letter-spacing: -.025em;
      font-variation-settings: "opsz" 144;
      text-wrap: balance;
    }
    h1 em {
      font-style: italic;
      font-weight: 600;
      color: var(--accent);
    }
    .lede {
      margin: clamp(8px, 1.6svh, 16px) auto 0;
      max-width: 32rem;
      font-size: clamp(1rem, 1.3vw, 1.15rem);
      line-height: 1.5;
      color: var(--ink-soft);
      text-wrap: pretty;
    }

    /* ---------- Scene ---------- */
    .stage {
      position: relative;
      z-index: 0;
      flex: 1 1 auto;
      min-height: clamp(220px, 40svh, 360px);
      overflow: hidden;
      /* Matches the frame: white sky above, sandy path below */
      background: linear-gradient(to bottom, var(--sky) 0 55%, var(--path) 82%);
    }
    .stage video {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
      /* Feather the bottom edge into the path colour */
      -webkit-mask-image: linear-gradient(to bottom, #000 88%, transparent);
              mask-image: linear-gradient(to bottom, #000 88%, transparent);
    }
    /* When the frame can't fill the stage, feather its sides as well */
    .stage video.is-contained {
      -webkit-mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent), linear-gradient(to bottom, #000 88%, transparent);
              mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent), linear-gradient(to bottom, #000 88%, transparent);
      -webkit-mask-composite: source-in;
              mask-composite: intersect;
    }

    /* ---------- Option boxes, right below the scene ---------- */
    .dock {
      position: relative;
      z-index: 2;
      margin-top: calc(-1 * var(--overlap));
      padding: 0 var(--gutter) max(18px, env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, transparent var(--overlap), var(--path) var(--overlap));
    }
    .options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(8px, 1.6vw, 20px);
      max-width: 52rem;
      margin: 0 auto;
    }
    .option {
      appearance: none;
      border: 0;
      margin: 0;
      padding: clamp(14px, 1.8vw, 22px) 6px;
      border-radius: 16px;
      background: #fff;
      color: var(--card-ink);
      font: 700 clamp(.95rem, 1.3vw, 1.2rem)/1.2 var(--body);
      white-space: nowrap;
      cursor: pointer;
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 14px 34px -20px rgb(18 56 42 / .45);
      transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s ease, color .2s ease;
    }
    .option.is-active {
      transform: translateY(-5px);
      color: var(--accent);
      box-shadow: 0 0 0 2px rgb(213 43 30 / .35), 0 22px 40px -20px rgb(18 56 42 / .5);
    }

    /* ---------- Scrub hint ---------- */
    .trail {
      display: flex;
      align-items: center;
      gap: 12px;
      width: fit-content;
      margin: 14px auto 0;
      padding: 8px 14px 8px 10px;
      border-radius: 999px;
      background: rgb(var(--wash) / .8);
      font-size: .85rem;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
    }
    .trail-arrow {
      display: grid;
      place-items: center;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      animation: nudge 1.8s ease-in-out infinite;
    }
    .trail-track {
      position: relative;
      width: 80px; height: 4px;
      border-radius: 4px;
      background: repeating-linear-gradient(to right, rgb(18 56 42 / .25) 0 6px, transparent 6px 10px);
    }
    .trail-dot {
      position: absolute;
      top: 50%;
      right: 0;
      width: 12px; height: 12px;
      margin: -6px -6px 0 0;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgb(213 43 30 / .2);
      transform: translateX(calc(var(--p, 0) * -80px));
    }
    .hero.has-scrubbed .trail-arrow { animation: none; }
    .hint-touch { display: none; }
    @media (hover: none) and (pointer: coarse) {
      .hint-mouse { display: none; }
      .hint-touch { display: inline; }
    }
    @keyframes nudge {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-5px); }
    }

    /* ---------- Phones ---------- */
    @media (max-width: 760px) {
      .nav-links { display: none; }
      .brand img { width: 40px; height: 40px; }
      .option { padding: 16px 6px; border-radius: 14px; font-size: 1rem; }
      .option.is-active { transform: translateY(-3px); }
    }

    /* Short landscape (phones on their side): keep everything on one screen */
    @media (min-aspect-ratio: 5/4) and (max-height: 560px) {
      .nav { padding-top: max(8px, env(safe-area-inset-top)); }
      .brand img { width: 34px; height: 34px; }
      .nav-links { padding: 4px; }
      .nav-links a { padding: 6px 12px; font-size: .85rem; }
      .copy { padding-top: 0; }
      h1 { font-size: clamp(1.6rem, 8svh, 2.6rem); }
      .lede { margin-top: 4px; font-size: .9rem; line-height: 1.4; }
      .stage { min-height: 150px; }
      .option { padding: 9px 6px; font-size: .9rem; }
      .dock { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
      .trail { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .trail-arrow { animation: none; }
      .option { transition: none; }
    }

    :focus-visible { outline: 3px solid var(--bench); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="hero" id="hero">
    <nav class="nav" aria-label="Primary">
      <a class="brand" href="#">
        <img src="ge-lion-logo.svg" alt="Great Eastern" width="38" height="38" />
      </a>
      <div class="nav-links">
        <a href="#">Trails</a>
        <a href="#">Field guides</a>
        <a href="#">For parents</a>
      </div>
    </nav>

    <section class="copy">
      <h1>Protection <em>explorer</em></h1>
      <p class="lede">Get started! Explore these 3 protection needs to get a complete protection analysis.</p>
    </section>

    <div class="stage" id="stage">
      <!-- The poster keeps the illustration visible until the video's frames can be decoded
           (iOS Safari defers loading video data until playback starts). -->
      <video id="scrub" data-src="explorer.mp4" poster="explorer-poster.jpg" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
    </div>

    <div class="dock">
      <!-- Each box holds the explorer in one pose: left = magnifying glass, middle = jump, right = binoculars -->
      <div class="options" id="options" role="group" aria-label="Explorer poses">
        <button class="option" type="button" data-pose="0" aria-pressed="false">Option 1</button>
        <button class="option" type="button" data-pose="1" aria-pressed="false">Option 2</button>
        <button class="option" type="button" data-pose="2" aria-pressed="false">Option 3</button>
      </div>
      <div class="trail" aria-hidden="true">
        <span class="trail-arrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
        </span>
        <span class="hint-mouse">Move your cursor left to explore</span>
        <span class="hint-touch">Drag left to explore</span>
        <span class="trail-track"><span class="trail-dot"></span></span>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const hero = document.getElementById('hero');
      const stage = document.getElementById('stage');
      const video = document.getElementById('scrub');
      const trail = hero.querySelector('.trail');
      const options = document.getElementById('options');
      const boxes = [...options.querySelectorAll('.option')];

      // Where the character lives inside the 16:9 frame (fractions), across the whole clip,
      // including the jump. Layout keeps this box on screen at every viewport size.
      const FRAME = { w: 640, h: 360 };
      const CHAR = { x0: 0.30, x1: 0.63, y0: 0.04, y1: 0.94 };

      function layout() {
        const cw = stage.clientWidth, ch = stage.clientHeight;
        if (!cw || !ch) return;
        // The option boxes overlap the bottom of the scene; the character stands just above them.
        const safeH = Math.max(ch * 0.5,
          options.getBoundingClientRect().top - stage.getBoundingClientRect().top - 8);

        const cover = Math.max(cw / FRAME.w, ch / FRAME.h);
        const charW = (CHAR.x1 - CHAR.x0) * FRAME.w;
        const charH = (CHAR.y1 - CHAR.y0) * FRAME.h;
        // Never scale past the point where the character would be cropped.
        const s = Math.min(cover, (cw * 0.9) / charW, (safeH * 0.94) / charH);
        const w = FRAME.w * s, h = FRAME.h * s;

        // Character centred horizontally, feet just above the option boxes.
        let left = cw / 2 - ((CHAR.x0 + CHAR.x1) / 2) * w;
        let top = safeH - 4 - CHAR.y1 * h;
        const clampInto = (v, size, box) => size >= box ? Math.min(0, Math.max(box - size, v)) : Math.max(0, Math.min(box - size, v));
        left = clampInto(left, w, cw);
        top = clampInto(top, h, ch);

        Object.assign(video.style, {
          width: w + 'px', height: h + 'px',
          left: left + 'px', top: top + 'px',
          objectFit: 'fill'
        });
        video.classList.toggle('is-contained', w < cw - 1);
      }

      new ResizeObserver(layout).observe(stage);
      layout();

      // ---- Load the clip ----
      // In memory as a blob so seeks are instant on any host. iOS Safari only decodes frames
      // once playback has started, so prime it with a muted inline play/pause; if that is
      // blocked (e.g. Low Power Mode), the first touch tries again. The poster shows meanwhile.
      const file = video.dataset.src;
      let primed = false;
      function prime() {
        if (primed) return;
        const p = video.play();
        if (!p) return;
        p.then(() => {
          primed = true;
          video.pause();
          video.currentTime = current * (video.duration - 0.05);
        }).catch(() => {});
      }
      function useSource(src) {
        video.src = src;
        video.load();
        prime();
      }
      video.addEventListener('loadeddata', () => {
        video.currentTime = current * (video.duration - 0.05);
      }, { once: true });
      window.addEventListener('pointerdown', prime, { passive: true });
      fetch(file)
        .then(r => r.ok ? r.blob() : Promise.reject())
        .then(blob => useSource(URL.createObjectURL(new Blob([blob], { type: 'video/mp4' }))))
        .catch(() => useSource(file)); // e.g. opened from file://

      // ---- Mouse-scrub: right edge = start, left edge = end ----
      let pointerTarget = 0; // 0..1 progress from the cursor
      let target = 0;        // 0..1 progress being eased toward
      let current = 0;       // smoothed progress
      let last = 0;
      let raf = 0;

      // ---- Option poses: a box holds the explorer in one pose, overriding the cursor ----
      // Each time sits in the middle of a held pose in the clip: magnifying glass, jump, binoculars.
      const POSE_TIMES = [0.55, 1.5, 3.2];
      let hoverPose = null, focusPose = null, touchPose = null;
      const activePose = () => hoverPose ?? focusPose ?? touchPose;

      function retarget() {
        const pose = activePose();
        const d = video.duration || 4.667;
        target = pose === null ? pointerTarget : Math.min(1, POSE_TIMES[pose] / (d - 0.05));
        boxes.forEach((box, i) => {
          box.classList.toggle('is-active', i === pose);
          box.setAttribute('aria-pressed', String(i === pose));
        });
        kick();
      }

      function setTargetFromX(clientX) {
        const x = Math.min(1, Math.max(0, clientX / window.innerWidth));
        pointerTarget = 1 - x;
        if (!hero.classList.contains('has-scrubbed')) hero.classList.add('has-scrubbed');
        retarget();
      }

      boxes.forEach((box, i) => {
        // Mouse / pen: hold the pose while the pointer is over the box
        box.addEventListener('pointerenter', e => {
          if (e.pointerType === 'touch') return;
          hoverPose = i; retarget();
        });
        box.addEventListener('pointerleave', () => {
          if (hoverPose === i) { hoverPose = null; retarget(); }
        });
        // Keyboard: hold the pose while the box has visible focus (not after a mouse click)
        box.addEventListener('focusin', () => {
          if (box.matches(':focus-visible')) { focusPose = i; retarget(); }
        });
        box.addEventListener('focusout', () => {
          if (focusPose === i) { focusPose = null; retarget(); }
        });
      });

      // Touch: touching a box acts like hovering it, and sliding a finger along the row
      // switches boxes. The pose stays after the finger lifts, until a touch lands elsewhere.
      function touchPoseAt(x, y) {
        const box = document.elementFromPoint(x, y)?.closest('.option');
        if (box && box.parentElement === options) {
          const i = boxes.indexOf(box);
          if (i !== touchPose) { touchPose = i; retarget(); }
        }
      }
      options.addEventListener('pointerdown', e => {
        if (e.pointerType !== 'mouse') touchPoseAt(e.clientX, e.clientY);
      });
      options.addEventListener('pointermove', e => {
        if (e.pointerType !== 'mouse') touchPoseAt(e.clientX, e.clientY);
      }, { passive: true });
      document.addEventListener('pointerdown', e => {
        if (e.pointerType !== 'mouse' && touchPose !== null && !options.contains(e.target)) {
          touchPose = null; retarget();
        }
      });

      window.addEventListener('pointermove', e => {
        if (e.pointerType === 'touch' && !e.isPrimary) return;
        setTargetFromX(e.clientX);
      }, { passive: true });
      hero.addEventListener('pointerdown', e => {
        if (e.pointerType !== 'mouse') setTargetFromX(e.clientX);
      }, { passive: true });

      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') pointerTarget = Math.min(1, pointerTarget + 0.08);
        else if (e.key === 'ArrowRight') pointerTarget = Math.max(0, pointerTarget - 0.08);
        else return;
        retarget();
      });

      // Next frame via rAF, with a timer fallback for browsers that throttle or pause rAF
      // (some in-app/embedded browsers); whichever fires first runs the tick.
      function nextFrame(cb) {
        let done = false;
        const run = t => { if (!done) { done = true; cancelAnimationFrame(id); clearTimeout(timer); cb(t); } };
        const id = requestAnimationFrame(run);
        const timer = setTimeout(() => run(performance.now()), 100);
      }

      function kick() {
        if (!raf) { last = 0; raf = 1; nextFrame(tick); }
      }

      function tick(now) {
        // Measure dt between rAF timestamps only; clamp so a stale or out-of-order
        // timestamp (e.g. after the tab was hidden) can't overshoot or produce NaN.
        const dt = last ? Math.min(0.064, Math.max(0, (now - last) / 1000)) : 1 / 60;
        last = now;
        // Frame-rate independent easing; option poses ease a little slower so the transition reads
        const rate = activePose() === null ? 9 : 5;
        current += (target - current) * (1 - Math.exp(-dt * rate));
        if (!Number.isFinite(current) || Math.abs(target - current) < 0.0005) current = target;

        trail.style.setProperty('--p', current.toFixed(4));

        const d = video.duration;
        if (d && !video.seeking && video.readyState >= 1) {
          const t = current * (d - 0.05);
          if (Math.abs(video.currentTime - t) > 1 / 60) video.currentTime = t;
        }

        if (current !== target || video.seeking) nextFrame(tick);
        else raf = 0;
      }
    })();
  </script>
</body>
</html>
